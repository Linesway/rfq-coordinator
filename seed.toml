# Default seed for local development; read via --seed.
#
# Units: `usd` is micro-USD (1_000_000 = $1). Asset balances are lots;
# 1 whole unit = 10^lot_decimals lots.

[assets.BTC]
lot_decimals = 5

[assets.ETH]
lot_decimals = 4

[assets.SOL]
lot_decimals = 3

[assets.DOGE]
lot_decimals = 0

[assets.HYPE]
lot_decimals = 2

[assets.AAPL]
lot_decimals = 2

